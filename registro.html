<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Únete a la Lealtad Digital — Barber 33</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131313">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barber 33">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --surface:            #131313;
    --surface-container:  #201f1f;
    --surface-high:       #2a2a2a;
    --secondary:              #f9ba82;
    --secondary-container:    #683d0f;
    --on-surface:         #f0edec;
    --on-surface-variant: #c8cace;
    --on-surface-muted:   #a8aab0;
    --outline-variant:    #45474a;
    --radius-sm: 0.375rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--surface); color: var(--on-surface);
    font-family: 'Manrope', sans-serif; display: -webkit-flex; display: flex;
    -webkit-justify-content: center; justify-content: center;
    padding: 32px 16px 40px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .mark {
    font-family: 'Newsreader', serif; font-size: 1.8rem; font-weight: 700;
    letter-spacing: .04em;
  }
  .brand .sub {
    font-size: .78rem; color: var(--on-surface-muted); margin-top: 6px; line-height: 1.5;
  }
  .stamp-preview {
    display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; margin: 22px 0;
  }
  .stamp-preview .dot + .dot { margin-left: 8px; }
  .stamp-preview .dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px dashed var(--outline-variant);
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    font-size: .85rem; color: var(--on-surface-muted);
  }
  .card {
    background: var(--surface-container); border: 1px solid var(--outline-variant);
    border-radius: var(--radius-lg); padding: 22px;
  }
  label { display: block; font-size: .78rem; color: var(--on-surface-muted); margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%; padding: 12px; border-radius: var(--radius-md);
    border: 1px solid var(--outline-variant); background: var(--surface-high);
    color: var(--on-surface); font-family: inherit; font-size: 1rem;
    -webkit-appearance: none;
  }
  input:focus, select:focus { outline: 2px solid var(--secondary); outline-offset: 1px; }
  .btn-crear {
    margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
    background: linear-gradient(135deg,#c47b00,#f9ba82); color: #2f1a00; font-weight: 700;
    font-size: .95rem; cursor: pointer;
  }
  .footnote {
    text-align: center; font-size: .72rem; color: var(--on-surface-muted);
    margin-top: 18px; line-height: 1.5;
  }
  .loading-screen {
    text-align: center; padding: 60px 20px;
  }
  .loading-screen .spinner {
    width: 36px; height: 36px; border: 3px solid var(--outline-variant);
    border-top-color: var(--secondary); border-radius: 50%;
    -webkit-animation: spin .8s linear infinite; animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen p { font-size: .88rem; color: var(--on-surface-muted); }

  .install-banner {
    background: var(--surface-container); border: 1px solid var(--outline-variant);
    border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px;
  }
  .install-banner h3 { font-size: .95rem; font-weight: 700; margin: 0 0 10px; text-align: center; }
  .install-banner .step {
    font-size: .82rem; color: var(--on-surface); line-height: 1.8; text-align: left;
    background: var(--surface-high); border-radius: var(--radius-md); padding: 14px 16px;
    margin-bottom: 10px;
  }
  .install-banner .step strong { color: var(--secondary); }
  .install-banner .btn-cerrar {
    width: 100%; padding: 12px; border: 1px solid var(--outline-variant); border-radius: var(--radius-sm);
    background: var(--surface-high); color: var(--on-surface-muted); font-weight: 500;
    font-size: .85rem; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" id="negocioNombre">BARBER 33</div>
    <div class="sub">Únete a nuestro programa de lealtad<br>y llévate un corte gratis por cada 5.</div>
  </div>

  <div id="loadingScreen" class="loading-screen" style="display:none;">
    <div class="spinner"></div>
    <p>Cargando tu tarjeta...</p>
  </div>

  <div id="installBanner" class="install-banner" style="display:none;">
    <h3>Agrega Barber 33 a tu inicio</h3>
    <div class="step" id="installStep"></div>
    <button class="btn-cerrar" onclick="cerrarBannerInstall()">Continuar sin agregar</button>
  </div>

  <div class="stamp-preview" id="stampPreview">
    <div class="dot">✂</div><div class="dot">✂</div><div class="dot">✂</div><div class="dot">✂</div><div class="dot">✂</div>
  </div>

  <div class="card" id="formCard">
    <label for="fNombre">Tu nombre</label>
    <input id="fNombre" type="text" placeholder="Ej. Juan Pérez" autocomplete="name">

    <label for="fTel">Tu teléfono (10 dígitos, opcional)</label>
    <input id="fTel" type="tel" placeholder="Ej. 9811234567" autocomplete="tel" maxlength="15" inputmode="numeric">

    <label for="fHijos">Hijos (opcional)</label>
    <select id="fHijos" onchange="actualizarHijos()" style="width:100%; padding:12px; border-radius:var(--radius-md); border:1px solid var(--outline-variant); background:var(--surface-high); color:var(--on-surface); font-family:inherit; font-size:1rem; -webkit-appearance:none; margin-bottom:14px;">
      <option value="0">Sin hijos</option>
      <option value="1">1 hijo</option>
      <option value="2">2 hijos</option>
      <option value="3">3 hijos</option>
      <option value="4">4 hijos</option>
      <option value="5">5 hijos</option>
    </select>
    <div id="camposHijos"></div>

    <label>Cumpleaños (día y mes)</label>
    <div style="display:-webkit-flex; display:flex;">
      <select id="fCumpleDia" style="padding:12px; border-radius:var(--radius-md); border:1px solid var(--outline-variant); background:var(--surface-high); color:var(--on-surface); font-family:inherit; font-size:1rem; margin-right:8px; -webkit-flex:1; flex:1;">
        <option value="">Día</option>
        <script>for(var d=1;d<=31;d++) document.write('<option value="'+d+'">'+d+'</option>');</script>
      </select>
      <select id="fCumpleMes" style="padding:12px; border-radius:var(--radius-md); border:1px solid var(--outline-variant); background:var(--surface-high); color:var(--on-surface); font-family:inherit; font-size:1rem; -webkit-flex:2; flex:2;">
        <option value="">Mes</option>
        <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
        <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
        <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
      </select>
    </div>

    <button class="btn-crear" onclick="crearTarjeta()">Crear mi tarjeta digital</button>
  </div>

  <div class="footnote" id="footnoteText">
    Tu tarjeta se guarda en este celular.<br>
    Muéstrasela a tu barbero en cada visita para sumar tus cortes.
  </div>
</div>

<script>
  var STORAGE_KEY = 'barber33_cliente';

  try {
    document.getElementById('negocioNombre').textContent =
      ((typeof BARBER33_CONFIG !== 'undefined' ? BARBER33_CONFIG.nombreNegocio : '') || 'Barber 33').toUpperCase();
  } catch(e) {}

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  function normalizarTel(t) {
    var d = (t || '').replace(/\D/g, '');
    if (d.length === 12 && d.indexOf('52') === 0) d = d.substring(2);
    if (d.length === 13 && d.indexOf('521') === 0) d = d.substring(3);
    return d.substring(0, 10);
  }

  // Limpiar +52 y caracteres no numéricos al salir del campo o pegar
  var fTel = document.getElementById('fTel');
  fTel.addEventListener('blur', function() {
    fTel.value = normalizarTel(fTel.value);
  });
  fTel.addEventListener('paste', function() {
    setTimeout(function() {
      fTel.value = normalizarTel(fTel.value);
    }, 50);
  });

  function fetchConTimeout(url, opciones, ms) {
    opciones = opciones || {};
    ms = ms || 4000;
    if (typeof AbortController !== 'undefined') {
      var ac = new AbortController();
      setTimeout(function() { ac.abort(); }, ms);
      opciones.signal = ac.signal;
    }
    return fetch(url, opciones);
  }

  function irConDatos(data) {
    var params = 'nombre=' + encodeURIComponent(data.nombre) +
      '&pagados=' + data.pagados + '&canjeados=' + data.canjeados;
    if (data.tel) params += '&tel=' + encodeURIComponent(data.tel);
    if (data.cumple) params += '&cumple=' + encodeURIComponent(data.cumple);
    if (data.hijos && data.hijos.length > 0) params += '&hijos=' + encodeURIComponent(JSON.stringify(data.hijos));
    window.location.replace('tarjeta.html?' + params);
  }

  // Si ya tiene tarjeta, sincronizar y redirigir
  var existente = null;
  try { existente = localStorage.getItem(STORAGE_KEY); } catch(e) {}

  if (existente) {
    var data = JSON.parse(existente);
    document.getElementById('loadingScreen').style.display = 'block';
    document.getElementById('stampPreview').style.display = 'none';
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('footnoteText').style.display = 'none';

    // Timeout de seguridad: si en 6 seg no se redirige, forzar
    var _redirigido = false;
    setTimeout(function() {
      if (!_redirigido) { _redirigido = true; irConDatos(data); }
    }, 6000);

    if (data.tel && typeof BARBER33_CONFIG !== 'undefined') {
      BARBER33_CONFIG.detectarServidor().then(function(url) {
        if (!url) { if (!_redirigido) { _redirigido = true; irConDatos(data); } return; }
        fetchConTimeout(url + '/api/tarjeta-digital/consulta?tel=' + encodeURIComponent(data.tel), {}, 3000)
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (res.ok) {
              data.pagados = res.pagados;
              data.canjeados = res.canjeados;
              if (res.nombre) data.nombre = res.nombre;
              if (res.cumple) data.cumple = res.cumple;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
            }
            if (!_redirigido) { _redirigido = true; irConDatos(data); }
          })
          .catch(function() { if (!_redirigido) { _redirigido = true; irConDatos(data); } });
      }).catch(function() { if (!_redirigido) { _redirigido = true; irConDatos(data); } });
    } else {
      _redirigido = true;
      irConDatos(data);
    }
  } else {
    // Primera vez — mostrar formulario
    var esStandalone = false;
    try {
      esStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    } catch(e) {}

    if (!esStandalone) {
      var ua = navigator.userAgent || '';
      var step = document.getElementById('installStep');
      if (/iPhone|iPad|iPod/.test(ua)) {
        step.innerHTML = '<strong>iPhone (Safari):</strong><br>' +
          '1. Toca el botón <strong>Compartir</strong> <span style="font-size:1.2em">⬆</span> (abajo)<br>' +
          '2. Baja y toca <strong>"Agregar a inicio"</strong><br>' +
          '3. Toca <strong>"Agregar"</strong> arriba a la derecha';
      } else {
        step.innerHTML = '<strong>Android (Chrome):</strong><br>' +
          '1. Toca los <strong>3 puntos</strong> ⋮ (arriba a la derecha)<br>' +
          '2. Toca <strong>"Agregar a pantalla de inicio"</strong><br>' +
          '3. Toca <strong>"Agregar"</strong> para confirmar';
      }
      document.getElementById('installBanner').style.display = 'block';
    }
  }

  function cerrarBannerInstall() {
    document.getElementById('installBanner').style.display = 'none';
  }

  function actualizarHijos() {
    var n = parseInt(document.getElementById('fHijos').value) || 0;
    var cont = document.getElementById('camposHijos');
    cont.innerHTML = '';
    for (var i = 1; i <= n; i++) {
      var div = document.createElement('div');
      div.style.cssText = 'margin-bottom:10px;padding:12px;background:var(--surface-high);border-radius:var(--radius-md);border:1px solid var(--outline-variant);';
      div.innerHTML = '<label style="display:block;font-size:.75rem;color:var(--on-surface-muted);margin-bottom:4px;">Nombre hijo ' + i + '</label>'
        + '<input id="fHijo' + i + '" type="text" placeholder="Nombre del hijo" style="width:100%;padding:10px;border-radius:var(--radius-md);border:1px solid var(--outline-variant);background:var(--surface-container);color:var(--on-surface);font-family:inherit;font-size:.95rem;">';
      cont.appendChild(div);
    }
  }

  function normalizarTel(t) {
    var d = (t || '').replace(/\D/g, '');
    if (d.length === 12 && d.indexOf('52') === 0) d = d.substring(2);
    if (d.length === 13 && d.indexOf('521') === 0) d = d.substring(3);
    return d;
  }

  function crearTarjeta() {
    var nombre = document.getElementById('fNombre').value.replace(/^\s+|\s+$/g, '');
    if (!nombre) { alert('Escribe tu nombre para crear tu tarjeta.'); return; }
    var tel = normalizarTel(document.getElementById('fTel').value);
    if (tel && tel.length !== 10) { alert('El teléfono debe tener exactamente 10 dígitos.'); return; }
    var dia = document.getElementById('fCumpleDia').value;
    var mes = document.getElementById('fCumpleMes').value;
    var cumple = (dia && mes) ? mes + '-' + ('0' + dia).slice(-2) : '';

    var numHijos = parseInt(document.getElementById('fHijos').value) || 0;
    var hijos = [];
    for (var i = 1; i <= numHijos; i++) {
      var hNombre = (document.getElementById('fHijo' + i) || {}).value;
      if (hNombre) hNombre = hNombre.replace(/^\s+|\s+$/g, '');
      if (hNombre) hijos.push({ nombre: hNombre });
    }

    var params = 'nombre=' + encodeURIComponent(nombre) + '&pagados=0&canjeados=0';
    if (tel) params += '&tel=' + encodeURIComponent(tel);
    if (cumple) params += '&cumple=' + encodeURIComponent(cumple);
    if (hijos.length > 0) params += '&hijos=' + encodeURIComponent(JSON.stringify(hijos));

    function irATarjeta() {
      window.location.replace('tarjeta.html?' + params);
    }

    if (tel && typeof BARBER33_CONFIG !== 'undefined') {
      BARBER33_CONFIG.detectarServidor().then(function(url) {
        if (!url) { irATarjeta(); return; }
        fetchConTimeout(url + '/api/tarjeta-digital/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nombre, tel: tel, cumple: cumple, hijos: hijos })
        }, 4000)
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.ok) {
            params = 'nombre=' + encodeURIComponent(res.nombre || nombre) +
              '&pagados=' + res.pagados + '&canjeados=' + res.canjeados;
            if (tel) params += '&tel=' + encodeURIComponent(tel);
            if (res.cumple) params += '&cumple=' + encodeURIComponent(res.cumple);
            else if (cumple) params += '&cumple=' + encodeURIComponent(cumple);
            if (res.hijos && res.hijos.length > 0) params += '&hijos=' + encodeURIComponent(JSON.stringify(res.hijos));
            else if (hijos.length > 0) params += '&hijos=' + encodeURIComponent(JSON.stringify(hijos));
          }
          irATarjeta();
        })
        .catch(function() { irATarjeta(); });
      }).catch(function() { irATarjeta(); });
    } else {
      irATarjeta();
    }
  }
</script>
</body>
</html>
